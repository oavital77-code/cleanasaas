# The gate every change passes: lint, types, and the unit test suite.
#
# The tests here are pure units (`lib/**/*.test.ts`) — the database logic lives
# in Postgres functions and is exercised by `supabase/tests/*.sql` against a real
# server, which is a separate harness and not part of this job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
